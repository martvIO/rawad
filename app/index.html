<!doctype html>
<!-- RTL by default; MobileApp keeps <html dir/lang> in sync with the chosen language.
     This is the groom MOBILE app entry (Capacitor). The full web app lives in frontend/;
     this package reuses its screens but ships ONLY the groom + auth + terms + help routes. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets safe-area-inset env() vars work under the iOS notch/home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>دعوة</title>
    <meta name="description" content="منصة دعوة — إدارة دعوات العرس للعريس" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#07070a" />

    <!-- Same fonts as the web app (FOUT, not FOIT). The app is online-only, so a CDN
         font load is acceptable; falls back to system fonts if offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Heebo:wght@300;400;600;700;900&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap"
    />

    <!-- Critical CSS — paints the dark theme + branded loader BEFORE React mounts. -->
    <style>
      html, body { margin: 0; background: #07070a; }
      #dawa-splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: #07070a; z-index: 9999;
      }
      #dawa-splash .ring {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(201, 168, 76, 0.18);
        border-top-color: #c9a84c;
        animation: dawa-splash-spin 0.8s linear infinite;
      }
      @keyframes dawa-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #dawa-splash .ring { animation-duration: 2s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="dawa-splash"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
