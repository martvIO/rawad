# Security scanning — SAST, dependency review, and CodeQL on every PR + push to
# main. Complements the gitleaks secret-scan in ci.yml (which reads .gitleaks.toml).
#
# WHY: the 2026-06-29 audit (docs/security/audit-2026-06-29.md) confirmed the app
# is clean on injection / XSS / auth-crypto, but there was no *standing* gate to
# keep it that way as AI-assisted commits land. These jobs are that gate.
#
# Baselines at audit time: Semgrep 0 findings, CodeQL n/a. npm audit's known
# transitive vulns (finding F-1) were remediated on 2026-07-16 — both packages
# now audit clean on prod deps, so npm-audit is BLOCKING as that finding intended.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A new advisory can land against dependencies nobody touched, which neither the
  # PR-only dependency-review nor a push-triggered run would ever notice. Catch
  # those on a weekly sweep instead of at the next unrelated commit.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  # Static analysis for injection, XSS, weak-crypto, unsafe-auth, hardcoded
  # secrets. Runs the same rulesets used in the audit. --error => fails the job
  # on any finding (baseline is 0). To make advisory, drop --error.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (OWASP + JS/TS + React + secrets)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --error --metrics=off \
            frontend/src backend/functions/src

  # Blocks a PR that introduces a NEW known-vulnerable dependency (diffs the PR's
  # manifest changes; does not fail on pre-existing vulns). PR-only.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Full npm audit of frontend + backend production deps. Both are at 0 vulns as of
  # 2026-07-16 (F-1 closed: the Amplify-pinned fast-xml-parser chain is lifted by an
  # `overrides` entry in frontend/package.json, and websocket-driver was lifted in
  # the backend lockfile), so this gate is blocking and a regression fails the build.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          npm install --no-audit --no-fund --prefix frontend
          npm install --no-audit --no-fund --prefix backend/functions
      - name: Audit frontend (prod)
        run: npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Audit backend functions (prod)
        run: npm audit --omit=dev --audit-level=high --prefix backend/functions

  # GitHub-native dataflow SAST for JS/TS — results land in the repo Security tab.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
