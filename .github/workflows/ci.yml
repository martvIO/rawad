# Continuous Integration — runs the test gates on every PR + push to main.
#
# WHY: testing was manual and the session-end auto-deploy is disabled, so a
# second maintainer (being onboarded) could land a regression with nothing
# catching it. This makes the unit + security-rules + e2e suites a hard gate.
#
# To ENFORCE blocking: GitHub → Settings → Branches → protect `main` → require
# the "unit" and "integration" status checks (e2e can stay advisory until it is
# proven stable in CI).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast, no emulator — the primary merge gate.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --prefix frontend
          npm install --no-audit --no-fund --prefix backend/functions
      - name: Frontend + backend unit tests
        run: npm run test:unit

  # Production build gate — catches Vite/tsc breakage before a manual deploy.
  # (The e2e job builds Functions but never the frontend bundle.)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --prefix frontend
          npm install --no-audit --no-fund --prefix backend/functions
      - name: Build frontend bundle
        run: npm run build
      - name: Build Cloud Functions
        run: node backend/scripts/build-functions.cjs

  # RTDB + (new) Firestore/Storage security-rules tests — needs the Java
  # emulators. firebase emulators:exec starts and tears the DB emulator down.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --prefix backend/functions
      - name: RTDB rules integration tests
        run: npm test

  # End-to-end across Chromium + WebKit (the two that matter most: Chrome +
  # iOS Safari). Heavier; advisory until proven stable, then promote to required.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund --prefix frontend
          npm install --no-audit --no-fund --prefix backend/functions
      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium webkit
      - name: Build Cloud Functions
        run: node backend/scripts/build-functions.cjs
      - name: Run e2e under the emulator suite
        env:
          CI: "true"
        # Start emulators, wait for the Functions + Vite dev server, then run
        # the suite scoped to chromium + webkit. emulators:exec tears the
        # emulators down when the inner command exits.
        run: |
          npx firebase emulators:exec \
            --only auth,database,firestore,storage,functions,hosting \
            --project dawa-aa793 \
            "bash -c 'npm --prefix frontend run dev:emulator & \
              npx --yes wait-on -t 120000 http://localhost:5173 && \
              (cd frontend && npx playwright test --project=chromium --project=webkit)'"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # Secrets scan — prevents a credential from ever being committed. The repo is
  # currently clean (the admin-SDK key + functions/.env are gitignored and were
  # never committed); this keeps it that way on every PR/push.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
