<!doctype html>
<!-- RTL by default; App.jsx keeps <html dir/lang> in sync with the chosen language -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دعوة — توزيع مكاتيب الأفراح</title>
    <meta name="description" content="منصة دعوة لإدارة وتوزيع مكاتيب الأعراس: إدارة قائمة المدعوين، توصيل الدعوات، وتأكيد الحضور." />

    <!-- Brand touchpoints: SVG favicon + PWA manifest derived from the seal in
         src/assets/brandSvg.js. Dark theme-color so mobile browser chrome matches. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07070a" />

    <!-- Fonts are self-hosted woff2 subsets (scripts/download-fonts.cjs). The old
         fonts.googleapis.com stylesheet was render-blocking (888 ms on mobile) and its
         late swap caused the /confirm desktop CLS failure — inlining @font-face removes
         the round-trip, and the metric-matched fallbacks below remove the shift.
         The invite-design picker's ~17 extra families are still fetched from Google
         on demand by src/utils/digitalFonts.js, which injects its own preconnects.

         Preload: the LCP text on / and /confirm is an Arabic <h1> in Amiri — at
         weight 900, which CSS matching resolves to the 700 face. That one file is
         therefore the only one worth preloading; everything else is discovered from
         the inline @font-face below. crossorigin is required even same-origin. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/amiri-700-arabic.woff2" />
    <!-- Designs using picker-only Google families fetch them at runtime
         (digitalFonts.js) — warm the DNS+TLS here so that fetch skips a
         round-trip; no-ops for the self-hosted core fonts above. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical CSS — paints the dark theme + a branded loader BEFORE React mounts,
         so a cold load never flashes white then black. React replaces #root on mount,
         which removes the splash automatically. -->
    <style>
      html, body { margin: 0; background: #07070a; }
      #dawa-splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: #07070a; z-index: 9999;
      }
      #dawa-splash .ring {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(201, 168, 76, 0.18);
        border-top-color: #c9a84c;
        animation: dawa-splash-spin 0.8s linear infinite;
      }
      @keyframes dawa-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #dawa-splash .ring { animation-duration: 2s; }
      }
    </style>

         Cloud Function for /d/** URLs so WhatsApp shows a large per-guest preview. -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="دعوة — توزيع مكاتيب الأفراح" />
    <meta property="og:description" content="منصة إدارة وتوزيع دعوات الأعراس" />

         WhatsApp/Facebook crawlers require it. The raster PNG (1200×630) is generated by
         frontend/scripts/render-og-default.cjs (committed; og-default.svg is the source). -->
    <meta property="og:image" content="https://dawa.to/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:description" content="منصة إدارة وتوزيع دعوات الأعراس" />
    <meta name="twitter:image" content="https://dawa.to/og-default.png" />
    <!--/OG_TAGS-->
