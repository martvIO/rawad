<!doctype html>
<!-- RTL by default; App.jsx keeps <html dir/lang> in sync with the chosen language -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دعوة — توزيع مكاتيب الأفراح</title>
    <meta name="description" content="منصة دعوة لإدارة وتوزيع مكاتيب الأعراس: إدارة قائمة المدعوين، توصيل الدعوات، وتأكيد الحضور." />

    <!-- Brand touchpoints: SVG favicon + PWA manifest derived from the seal in
         src/assets/brandSvg.js. Dark theme-color so mobile browser chrome matches. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#07070a" />

    <!-- Fonts loaded from <head> (preconnect + stylesheet) instead of a JS-injected
         @import — they start downloading before the bundle parses. display=swap keeps
         text visible during load (FOUT, not FOIT). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Heebo:wght@300;400;600;700;900&family=Frank+Ruhl+Libre:wght@400;700;900&display=swap"
    />

    <!-- Critical CSS — paints the dark theme + a branded loader BEFORE React mounts,
         so a cold load never flashes white then black. React replaces #root on mount,
         which removes the splash automatically. -->
    <style>
      html, body { margin: 0; background: #07070a; }
      #dawa-splash {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: #07070a; z-index: 9999;
      }
      #dawa-splash .ring {
        width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(201, 168, 76, 0.18);
        border-top-color: #c9a84c;
        animation: dawa-splash-spin 0.8s linear infinite;
      }
      @keyframes dawa-splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #dawa-splash .ring { animation-duration: 2s; }
      }
    </style>

    <!-- Default Open Graph tags — replaced server-side by the digitalInvitePreview
         Cloud Function for /d/** URLs so WhatsApp shows a large per-guest preview. -->
    <!--OG_TAGS-->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="دعوة — توزيع مكاتيب الأفراح" />
    <meta property="og:description" content="منصة إدارة وتوزيع دعوات الأعراس" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="دعوة — توزيع مكاتيب الأفراح" />
    <meta name="twitter:description" content="منصة إدارة وتوزيع دعوات الأعراس" />
    <!--/OG_TAGS-->
  </head>
  <body>
    <div id="root">
      <!-- Pre-mount branded splash; React clears #root on first render. -->
      <div id="dawa-splash"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
