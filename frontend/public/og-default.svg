  <!-- Tagline -->
  <text x="600" y="476" text-anchor="middle" font-family="Cairo, Heebo, sans-serif" font-size="34" fill="#f5e6b8" fill-opacity="0.92">توزيع مكاتيب الأفراح · دعوات رقمية</text>
  <text x="600" y="528" text-anchor="middle" font-family="Cairo, Heebo, sans-serif" font-size="26" fill="#8a7a58">تسليم باليد · إثبات بالصورة · معرض صور بالذكاء الاصطناعي</text>
